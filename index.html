<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <main>
        <h1>Contact Us</h1>
        <p>Fill the form below and we'll get back to you.</p>

        <form id="contactForm" class="contact-form" novalidate>
            <label for="name">Name</label>
            <input type="text" id="name" name="name" required>

            <label for="email">Email</label>
            <input type="email" id="email" name="email" required>

            <label for="message">Message</label>
            <textarea id="message" name="message" rows="6" required></textarea>

            <button type="submit">Send</button>
            <p id="formStatus" class="status" aria-live="polite"></p>
        </form>
    </main>

    <style>
        body { font-family: Arial, sans-serif; padding: 2rem; background:#f7f7f7; }
        main { max-width:700px; margin:0 auto; background:#fff; padding:1.5rem; border-radius:8px; box-shadow:0 2px 8px rgba(0,0,0,0.06); }
        .contact-form { display:flex; flex-direction:column; gap:.6rem; }
        label { font-weight:600; margin-top:.4rem; }
        input, textarea { padding:.6rem; border:1px solid #ccc; border-radius:4px; font-size:1rem; }
        button { margin-top:.6rem; padding:.7rem 1rem; border:none; background:#0366d6; color:#fff; border-radius:6px; cursor:pointer; }
        button:disabled { opacity:0.6; cursor:default; }
        .status { margin-top:.6rem; color:green; }
        @media (max-width:480px){ body{padding:1rem} main{padding:1rem} }
    </style>

    <script>
        const form = document.getElementById('contactForm');
        const status = document.getElementById('formStatus');

        form.addEventListener('submit', function(e){
            e.preventDefault();
            status.textContent = '';
            const name = form.name.value.trim();
            const email = form.email.value.trim();
            const message = form.message.value.trim();

            if(!name || !email || !message){
                status.style.color = 'crimson';
                status.textContent = 'Please fill all fields.';
                return;
            }

            // Demo submit: replace with real endpoint as needed
            button = form.querySelector('button[type=submit]');
            button.disabled = true;
            status.style.color = 'black';
            status.textContent = 'Sending...';

            // Simulate network
            setTimeout(() => {
                button.disabled = false;
                form.reset();
                status.style.color = 'green';
                status.textContent = 'Message sent (demo).';
            }, 900);
        });
    </script>
</body>
</html>
